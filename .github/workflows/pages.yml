name: Publish CACE Imatges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image validation dependency
        run: python -m pip install -r requirements.txt
      - name: Build web app
        run: python scripts/build.py --site-only --since HEAD^
      - name: Test search language and relevance
        run: node --test tests/search.test.cjs
      - name: Test incremental image validation
        run: python tests/optimize-catalog.test.py
      - name: Verify the complete catalogue
        run: python scripts/check-site.py --since HEAD^
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: python scripts/wait-pages-artifact.py
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
